# === LAYOUT-AND-FLOATING ===
# Layout strategy for this configuration:
#
# 1. Default layout (set globally above): `tiles` + `auto` orientation.
#    Single-window workspaces (WS1–WS7, WS9) fill the screen naturally — no per-workspace
#    config needed. The tiling tree reduces to a single root window.
#
# 2. WS10 (Telegram + WhatsApp): vertical tiling, 1:1 (AeroSpace default equal split).
#    Declarative: the `layout v_tiles` command is appended to each app's routing block
#    in WINDOW-ROUTING above (`run = ['move-node-to-workspace 10', 'layout v_tiles']`).
#    No manual resize needed — AeroSpace splits the container 50/50.
#
# 3. WS8 (Notion Calendar + Mail): vertical tiling. Declarative `layout v_tiles` is set
#    the same way as WS10. The desired ~1:2 ratio (Calendar bigger) CANNOT be pinned
#    declaratively in AeroSpace 0.20.3-Beta — there is no `default-split-ratio` or
#    `[[on-window-detected]]` option for split proportion. After both windows are tiled,
#    achieve cal:mail = 1:2 (Mail twice as wide) MANUALLY:
#      • Focus Calendar (com.apple.iCal), then run from a terminal:
#          aerospace resize smart -400
#        (shrinks Calendar width so Mail gets ~2/3). Adjust value to taste.
#      • `resize smart` automatically picks the correct axis (height for a vertical
#        parent, width for horizontal), so the same command works regardless of
#        orientation. Pixel value depends on monitor resolution.
#    This is a one-time manual step per session (until you cycle the windows).
#    Recorded in the trial checklist as a manual verification step.
#
# 4. The `ctrl-cmd-t` keybind (set in KEYBINDS:FOCUS-MOVE-RESIZE) toggles between
#    `tiles` and `accordion` for any workspace on demand — useful if you want
#    temporary fullscreen-like behavior on WS8/WS10 without untiling.
#
# 5. Floating exceptions below: dialog-heavy / system apps that don't tile well.
#    Scope is intentionally narrow — system Settings, Finder, Activity Monitor.
#    Add more app-ids here as the need is observed in real use.

[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'
