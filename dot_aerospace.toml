# AeroSpace config — aerospace-migration plan
# Generated: 2026-06-11

# Do NOT enable until trial is complete and validated
start-at-login = false

# Sketchybar integration — OUT OF SCOPE for v1 (dormant)
# after-startup-command = ['exec-and-forget sketchybar --bar height=37']

# Default layout — fullscreen-friendly for one-window workspaces
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Accordion windows full-width (0 = no stack-peek offset)
accordion-padding = 0

# Normalization — documented defaults
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Mouse follows focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Key mapping
[key-mapping]
preset = 'qwerty'

# Gaps — minimal (user runs fullscreen)
[gaps]
inner.horizontal = 0
inner.vertical   = 0
outer.left       = 0
outer.bottom     = 0
outer.top        = 0
outer.right      = 0

[mode.main.binding]
# (bindings filled by Tasks 4 and 5)

# === KEYBINDS:WORKSPACES ===
ctrl-cmd-1 = 'workspace 1'
ctrl-cmd-2 = 'workspace 2'
ctrl-cmd-3 = 'workspace 3'
ctrl-cmd-4 = 'workspace 4'
ctrl-cmd-5 = 'workspace 5'
ctrl-cmd-6 = 'workspace 6'
ctrl-cmd-7 = 'workspace 7'
ctrl-cmd-8 = 'workspace 8'
ctrl-cmd-9 = 'workspace 9'
ctrl-cmd-0 = 'workspace 10'
ctrl-cmd-minus = 'workspace sketch'

ctrl-cmd-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
ctrl-cmd-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
ctrl-cmd-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
ctrl-cmd-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
ctrl-cmd-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
ctrl-cmd-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
ctrl-cmd-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
ctrl-cmd-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
ctrl-cmd-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
ctrl-cmd-shift-0 = 'move-node-to-workspace --focus-follows-window 10'
ctrl-cmd-shift-minus = 'move-node-to-workspace --focus-follows-window sketch'

# === KEYBINDS:FOCUS-MOVE-RESIZE ===
# Focus navigation (vim-style hjkl). Moves focus within the tiling tree.
ctrl-cmd-h = 'focus left'
ctrl-cmd-j = 'focus down'
ctrl-cmd-k = 'focus up'
ctrl-cmd-l = 'focus right'

# Window movement within the current workspace's tiling tree (NOT cross-workspace).
# Safe: shift+hjkl never collides with shift+digit move-to-workspace binds.
ctrl-cmd-shift-h = 'move left'
ctrl-cmd-shift-j = 'move down'
ctrl-cmd-shift-k = 'move up'
ctrl-cmd-shift-l = 'move right'

# On-demand tiling toggle for WS8/WS10 (and any ad-hoc tiling need).
# Toggles between `tiles` (split-view) and `accordion` (stacked = looks fullscreen
# when only one window is foregrounded). Mnemonic: 't' = tile.
# ctrl-cmd-f is FORBIDDEN (macOS native fullscreen); ctrl-cmd-t has no macOS conflict.
ctrl-cmd-t = 'layout tiles accordion'

# i3-style resize mode: ctrl-cmd-r enters, then hjkl resize (vim axes), esc/enter exits.
ctrl-cmd-r = 'mode resize'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
equal = 'balance-sizes'
enter = 'mode main'
esc = 'mode main'

# === MONITOR-ASSIGNMENT ===
# When external present: WS1-10 on MPG321UX OLED, sketch on built-in.
# When undocked: all WS collapse to built-in via fallback.
[workspace-to-monitor-force-assignment]
1 = ['MPG321UX OLED', 'built-in']
2 = ['MPG321UX OLED', 'built-in']
3 = ['MPG321UX OLED', 'built-in']
4 = ['MPG321UX OLED', 'built-in']
5 = ['MPG321UX OLED', 'built-in']
6 = ['MPG321UX OLED', 'built-in']
7 = ['MPG321UX OLED', 'built-in']
8 = ['MPG321UX OLED', 'built-in']
9 = ['MPG321UX OLED', 'built-in']
10 = ['MPG321UX OLED', 'built-in']
sketch = ['built-in']

